[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npx vite"
  targetPort = 5173
  port = 8888

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
